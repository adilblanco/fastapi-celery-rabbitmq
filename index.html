<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FastAPI + Celery + RabbitMQ</title>
  <style>
    body {
      max-width: 560px;
      margin: 60px auto;
      padding: 0 20px;
      color: #202124;
      font: 16px/1.5 system-ui, sans-serif;
    }

    form, #task {
      padding: 24px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    form {
      display: flex;
      gap: 12px;
      align-items: end;
    }

    label {
      flex: 1;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      font: inherit;
    }

    button {
      width: auto;
      cursor: pointer;
    }

    #task {
      margin-top: 20px;
    }

    #task[hidden] {
      display: none;
    }

    code {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>Traitement asynchrone</h1>
  <p>La tâche calcule <code>x² + y²</code> après cinq secondes.</p>

  <form id="form">
    <label>
      x
      <input id="x" type="number" value="3" required>
    </label>
    <label>
      y
      <input id="y" type="number" value="4" required>
    </label>
    <button type="submit">Calculer</button>
  </form>

  <section id="task" hidden>
    <div>Task ID : <code id="task-id"></code></div>
    <div>Statut : <strong id="status"></strong></div>
    <div id="result"></div>
  </section>

  <script>
    const form = document.querySelector("#form");
    const button = form.querySelector("button");
    const taskBox = document.querySelector("#task");
    const taskIdBox = document.querySelector("#task-id");
    const statusBox = document.querySelector("#status");
    const resultBox = document.querySelector("#result");

    const wait = (milliseconds) =>
      new Promise((resolve) => setTimeout(resolve, milliseconds));

    async function followTask(taskId) {
      while (true) {
        const response = await fetch(`/tasks/${taskId}`);
        const task = await response.json();

        statusBox.textContent = task.status;

        if (task.status === "SUCCESS") {
          resultBox.textContent = `Résultat : ${task.result}`;
          return;
        } else if (task.status === "FAILURE") {
          resultBox.textContent = `Erreur : ${task.error}`;
          return;
        }

        await wait(1000);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      taskBox.hidden = false;
      taskIdBox.textContent = "Envoi...";
      statusBox.textContent = "PENDING";
      resultBox.textContent = "";

      try {
        const response = await fetch("/tasks", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            x: Number(document.querySelector("#x").value),
            y: Number(document.querySelector("#y").value),
          }),
        });

        if (!response.ok) {
          throw new Error("Impossible de soumettre la tâche");
        }

        const task = await response.json();
        taskIdBox.textContent = task.task_id;
        statusBox.textContent = task.status;
        await followTask(task.task_id);
      } catch (error) {
        statusBox.textContent = "ERROR";
        resultBox.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
